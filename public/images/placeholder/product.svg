<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="No product photo yet">
  <!--
    The one committed stand-in for a missing product photo. Referenced by
    src/components/commerce/product-image.tsx (its fallback) and by
    prisma/seed/catalog.ts (demo catalogue Media rows).

    Obsidian Kinetic redesign: transparent background, so it sits on the
    product tile's own surface; a faint hairline device outline and the
    brand emblem at low contrast. Colours are literal token values from
    src/app/globals.css (an img-loaded SVG cannot read CSS variables):
    outline-variant #26262B, outline #3A3A42, on-surface-variant #9A9AA3.

    No double hyphen anywhere in this comment: it is illegal inside an XML
    comment and makes browsers reject the whole file.
  -->
  <g fill="none" stroke="#3A3A42" stroke-width="2" stroke-linejoin="round">
    <rect x="120" y="92" width="160" height="104" rx="8"/>
    <path d="M100 206h200l-10 12H110z"/>
  </g>
  <g transform="translate(182 126)">
    <rect x="0.75" y="0.75" width="34.5" height="34.5" rx="8" fill="#141417" stroke="#26262B" stroke-width="1.5"/>
    <rect x="13" y="13" width="10" height="10" rx="3" fill="#FF5A1F" opacity="0.55"/>
    <circle cx="9" cy="9" r="2.5" fill="#9A9AA3" opacity="0.5"/>
    <circle cx="27" cy="27" r="2.5" fill="#9A9AA3" opacity="0.5"/>
  </g>
  <text x="200" y="250" fill="#9A9AA3" opacity="0.7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.5" text-anchor="middle">PHOTO COMING SOON</text>
</svg>
